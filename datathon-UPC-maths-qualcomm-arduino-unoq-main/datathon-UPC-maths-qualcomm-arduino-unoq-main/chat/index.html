<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xat amb la placa</title>
<style>
  :root { --ink: #1d2433; --muted: #5c667a; --line: #dfe3ea; --bg: #f5f7fa; --card: #fff;
          --ok: #1b7f3b; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6; --accent: #1f5fbf; --mine: #e8f0fe; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
         background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 20px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--bg);
          border: 1px solid var(--line); color: var(--muted); }
  .pill.up { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .pill.down { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .secondary { margin-left: auto; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--mine); }
  .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg.error { align-self: flex-start; background: var(--bad-bg); color: var(--bad); }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .stats { align-self: flex-start; font-size: 12px; color: var(--muted); margin: -6px 0 0 4px; }
  .empty { text-align: center; color: var(--muted); margin-top: 15vh; }
  form { background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  form .inner { flex-direction: row; align-items: flex-end; gap: 10px; }
  textarea { flex: 1; font: inherit; color: inherit; resize: none; padding: 10px 12px; border: 1px solid var(--line);
             border-radius: 8px; max-height: 180px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .primary { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; }
  .primary.stop { background: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Xat amb la placa</h1>
  <span id="s-llm" class="pill">model</span>
  <button class="secondary" id="clear">Conversa nova</button>
</header>
<div id="log"><div class="inner" id="messages"></div></div>
<form id="form">
  <div class="inner">
    <textarea id="input" rows="1" placeholder="Escriu un missatge… (Enter envia, Maj+Enter fa una línia nova)" autofocus></textarea>
    <button class="primary" id="send">Envia</button>
  </div>
</form>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), list = $("messages"), input = $("input"), send = $("send");
let history = [];        // what the model sees: {role, content}
let running = null;      // AbortController while the model is writing

function bubble(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  list.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function showEmpty() {
  list.innerHTML = '<div class="empty">Pregunta el que vulguis.<br>El model corre dins la placa, sense internet.</div>';
}

function setRunning(controller) {
  running = controller;
  send.textContent = controller ? "Atura" : "Envia";
  send.classList.toggle("stop", !!controller);
}

async function refreshStatus() {
  const pill = $("s-llm");
  try {
    const info = await (await fetch("/api/info")).json();
    pill.textContent = info.model + (info.llm ? "" : " · aturat");
    pill.className = "pill " + (info.llm ? "up" : "down");
  } catch {
    pill.textContent = "sense connexió amb la placa";
    pill.className = "pill down";
  }
}

async function ask(text) {
  // "Conversa nova" swaps the array, so a reply that arrives late stays in the old one
  const turns = history;
  if (!turns.length) list.innerHTML = "";
  turns.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("assistant thinking", "Pensant…");
  const controller = new AbortController();
  setRunning(controller);
  let reply = "", failed = "";

  const handle = (event) => {
    if (event.delta) {
      reply += event.delta;
      out.className = "msg assistant";
      out.textContent = reply;
      log.scrollTop = log.scrollHeight;
    } else if (event.error) {
      failed = event.error;
    } else if (event.done) {
      const parts = [event.seconds + " s"];
      if (event.tokens) parts.push(event.tokens + " tokens");
      if (event.tokens_per_second) parts.push(event.tokens_per_second + " tokens/s");
      const stats = document.createElement("div");
      stats.className = "stats";
      stats.textContent = parts.join(" · ");
      out.after(stats);
    }
  };

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: turns }),
      signal: controller.signal,
    });
    if (!response.ok) throw new Error((await response.json()).error || response.statusText);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let pending = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      pending += decoder.decode(value, { stream: true });
      const lines = pending.split("\n");
      pending = lines.pop();
      for (const line of lines) if (line.trim()) handle(JSON.parse(line));
    }
  } catch (error) {
    if (error.name !== "AbortError") failed = error.message;
  }

  setRunning(null);
  if (reply) {
    turns.push({ role: "assistant", content: reply });
  } else {
    // Nothing came back: forget the question so the next one starts clean
    turns.pop();
    out.remove();
  }
  if (turns !== history) return;  // the conversation was cleared meanwhile
  if (failed) bubble("error", "Error: " + failed);
  else if (!reply && !controller.signal.aborted) bubble("error", "El model no ha respost res.");
  log.scrollTop = log.scrollHeight;
  refreshStatus();
  input.focus();
}

function resize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight + 2, 180) + "px";
}

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  if (running) return running.abort();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  resize();
  ask(text);
});

input.addEventListener("input", resize);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    if (!running) $("form").requestSubmit();
  }
});

$("clear").addEventListener("click", () => {
  if (running) running.abort();
  history = [];
  showEmpty();
  input.focus();
});

showEmpty();
refreshStatus();
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
