<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#081B2D">
<title>Pista · maths tutor</title>
<style>
  /* Fonts ship with the tutor (tutor/static/fonts, SIL Open Font Licence): the page works offline on the board. */
  @font-face { font-family: "Bricolage"; src: url("/static/fonts/BricolageGrotesque-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Bricolage"; src: url("/static/fonts/BricolageGrotesque-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Instrument"; src: url("/static/fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Instrument"; src: url("/static/fonts/InstrumentSans-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

  :root {
    /* A squared exercise book, a blue pen, a highlighter, the teacher's tick, and the board's LEDs */
    --paper: #F5F8FD; --grid: #E2E9F5; --sheet: #FFFFFF; --line: #D3DCEB;
    --ink: #16213D; --ink-2: #4A5677;
    --pen: #2B59D9; --pen-ink: #1E43AE; --pen-soft: #E8EEFF;
    --hi: #FFE24A; --hi-soft: #FFF7C7; --hi-ink: #6B5300;
    --tick: #12804F; --tick-soft: #E1F4E9; --red: #C9352F; --red-soft: #FCEAE8;
    --led-bg: #0D1530; --led-off: #1A2546; --led-dim: #27407F; --led-on: #79ACFF;
    --display: "Bricolage", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
    --lift: 0 1px 0 var(--line), 0 10px 24px -14px rgba(22, 33, 61, .35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 17px/1.5 var(--body);
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; background-position: -1px -1px;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; border-radius: 6px; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.12; margin: 0; letter-spacing: -.01em; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-left));
         background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; background: none; border: 0; padding: 4px; }
  .brand b { font-family: var(--display); font-size: 24px; letter-spacing: -.02em; }
  .brand small { color: var(--ink-2); font-size: 14px; }
  .mark { display: grid; grid-template-columns: repeat(3, 6px); gap: 2px; padding: 4px; border-radius: 6px; background: var(--led-bg); }
  .mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--led-off); }
  .mark i.on { background: var(--led-on); box-shadow: 0 0 6px var(--led-on); }
  .who { font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 15px; color: var(--ink-2); }
  .seg button.on { background: var(--ink); color: #fff; font-weight: 700; }
  .ghost { border: 1px solid transparent; background: none; border-radius: 999px; padding: 8px 14px; min-height: 44px; color: var(--pen-ink); font-weight: 700; }
  .ghost:hover { background: var(--pen-soft); }
  .ghost { display: inline-flex; align-items: center; gap: 8px; }
  .ghost svg { width: 20px; height: 20px; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 64px; }

  /* ---------- shared pieces ---------- */
  .card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--lift); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 14px;
         border: 2px solid var(--ink); background: var(--sheet); font-weight: 700; box-shadow: 0 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; box-shadow: none; }
  .btn.primary { background: var(--pen); border-color: var(--pen-ink); color: #fff; box-shadow: 0 3px 0 var(--pen-ink); }
  .btn.hint { background: var(--hi); border-color: var(--ink); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .muted { color: var(--ink-2); }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; background: var(--pen-soft); color: var(--pen-ink); white-space: nowrap; }
  .tag.plain { background: var(--paper); color: var(--ink-2); font-weight: 400; border: 1px solid var(--line); }
  .tag svg { width: 16px; height: 16px; }

  /* ---------- the LED matrix mirror (8 x 13, like the board) ---------- */
  .led { background: var(--led-bg); border-radius: var(--r-md); padding: 14px; color: #C8D6F5; }
  .led-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; aspect-ratio: 13 / 8; }
  .led-grid i { border-radius: 50%; background: var(--led-off); transition: background .18s, box-shadow .18s; }
  .led-grid i.dim { background: var(--led-dim); }
  .led-grid i.on { background: var(--led-on); box-shadow: 0 0 8px 1px color-mix(in srgb, var(--led-on) 70%, transparent); }
  .led-cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3BD27A; box-shadow: 0 0 6px #3BD27A; }
  .live.off::before { background: #7A869F; box-shadow: none; }

  /* ---------- setup ---------- */
  .welcome { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
  .hello h1 { font-size: clamp(34px, 5.4vw, 60px); max-width: 15ch; }
  .hello h1 .scrib { background: linear-gradient(transparent 58%, var(--hi) 58%, var(--hi) 90%, transparent 90%); padding: 0 .08em; }
  .hello p.lead { font-size: 19px; max-width: 54ch; margin: 14px 0 26px; color: var(--ink-2); }
  .setup { padding: 22px; display: grid; gap: 22px; }
  .field > .label { display: block; font-weight: 700; margin-bottom: 8px; }
  .field .help { font-size: 14px; color: var(--ink-2); margin-left: 6px; font-weight: 400; }
  .name { width: 100%; max-width: 380px; min-height: 52px; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font-size: 19px; }
  .name:focus { border-color: var(--pen); outline: none; background: #fff; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .topic { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; min-height: 60px;
           border-radius: 14px; border: 2px solid var(--line); background: var(--sheet); transition: border-color .12s, background .12s; }
  .topic:hover { border-color: var(--ink-2); }
  .topic .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--paper); color: var(--ink); }
  .topic .ic svg { width: 24px; height: 24px; }
  .topic b { display: block; font-size: 15px; line-height: 1.25; }
  .topic small { color: var(--ink-2); font-size: 13px; }
  .topic[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
  .topic[aria-pressed="true"] .ic { background: var(--pen); color: #fff; }
  .stairs { display: flex; align-items: flex-end; gap: 6px; height: 112px; max-width: 460px; }
  .stair { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; border: 2px solid var(--line); border-radius: 10px 10px 4px 4px;
           background: var(--sheet); font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink-2); min-width: 0; }
  .stair:hover { border-color: var(--ink-2); }
  .stair.below { background: var(--pen-soft); border-color: #C8D5FB; color: var(--pen-ink); }
  .stair[aria-pressed="true"] { background: var(--pen); border-color: var(--pen-ink); color: #fff; }
  .stairs-legend { display: flex; justify-content: space-between; max-width: 460px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .go { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .go .btn { min-width: 180px; font-size: 19px; }
  .error { color: var(--red); font-weight: 700; }
  .side { display: grid; gap: 16px; position: sticky; top: 84px; }
  .how { padding: 18px; }
  .how h2 { font-size: 19px; margin-bottom: 10px; }
  .how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: rung; }
  .how li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 15px; counter-increment: rung; }
  .how li::before { content: counter(rung); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--hi-soft); color: var(--hi-ink); border: 1px solid #F1D55A; }
  .how li:last-child::before { background: var(--paper); color: var(--ink-2); border-color: var(--line); }

  /* ---------- play ---------- */
  .play { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  .problem-card { grid-column: 1 / -1; }
  .answer-col { display: grid; gap: 20px; min-width: 0; }
  .board-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .sheet-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; }
  .zoom { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); font-weight: 700; font-size: 14px; color: var(--ink-2); }
  .zoom:hover { color: var(--ink); border-color: var(--ink-2); }
  .zoom svg { width: 16px; height: 16px; }
  .sheet { padding: 20px; position: relative; }
  .sheet-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .sheet-head .grow { flex: 1; }
  .streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; color: var(--hi-ink); background: var(--hi-soft); padding: 4px 10px; border-radius: 8px; }
  .streak svg { width: 16px; height: 16px; }
  .problem { position: relative; display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); background: #fff; overflow: hidden; cursor: zoom-in; }
  .problem img { display: block; width: 100%; height: auto; min-height: 60px; }
  .problem .stamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .problem .stamp svg { width: min(34%, 190px); height: auto; overflow: visible; }
  .stamp path { fill: none; stroke: var(--tick); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 260; stroke-dashoffset: 260; opacity: .8; }
  .stamp.show path { animation: draw .55s .05s cubic-bezier(.6, 0, .3, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .letters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 2px 0 6px; }
  .letter { position: relative; height: 78px; border-radius: 16px; border: 2px solid var(--ink); background: var(--sheet); box-shadow: 0 4px 0 var(--ink);
            font-family: var(--display); font-weight: 700; font-size: 34px; transition: transform .12s, box-shadow .12s, background .12s; }
  .letter:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); background: var(--pen-soft); }
  .letter:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .letter:disabled { box-shadow: none; transform: translateY(4px); }
  .letter:disabled:not(.right):not(.wrong):not(.out) { opacity: .45; }
  .letter.right { background: var(--tick); border-color: var(--tick); color: #fff; box-shadow: none; transform: none; }
  .letter.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .letter.out { background: var(--paper); border-color: var(--line); color: #9AA4BA; }
  .letter.wrong::after, .letter.out::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 3px; border-radius: 2px; background: currentColor; transform: rotate(-14deg); }
  .letter.shake { animation: shake .36s; }
  @keyframes shake { 20% { transform: translate(4px, 4px); } 40% { transform: translate(-4px, 4px); } 60% { transform: translate(3px, 4px); } 80% { transform: translate(-2px, 4px); } }
  .letter kbd { position: absolute; top: 6px; right: 8px; font: 700 11px var(--body); color: var(--ink-2); opacity: .7; }
  .letter.right kbd, .letter:disabled kbd { display: none; }

  .feedback { min-height: 28px; margin: 14px 0 0; padding: 0; font-weight: 700; font-size: 18px; display: flex; gap: 10px; align-items: flex-start; }
  .feedback:empty { display: none; }
  .feedback.ok { color: var(--tick); } .feedback.bad { color: var(--red); } .feedback.info { color: var(--pen-ink); }
  .feedback svg { width: 22px; height: 22px; flex: none; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }
  .actions .push { margin-left: auto; }
  .confirm { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--hi-soft); border: 1px dashed #D9B92C; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .confirm span { flex: 1 1 220px; font-weight: 700; }
  .keys { margin-top: 18px; font-size: 13px; color: var(--ink-2); }
  .keys kbd { font: 700 12px var(--body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: #fff; }
  .done-all { padding: 28px; text-align: center; }

  /* ---------- the hint ladder ---------- */
  .ladder { padding: 18px 18px 8px; position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; overscroll-behavior: contain; }
  .ladder h2 { font-size: 19px; }
  .ladder > p { margin: 4px 0 14px; font-size: 14px; color: var(--ink-2); }
  .rungs { list-style: none; margin: 0; padding: 0 0 0 0; position: relative; }
  .rungs::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 26px; width: 2px; background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px); }
  .rung { position: relative; display: grid; grid-template-columns: 32px 1fr; column-gap: 12px; padding-bottom: 14px; }
  .rung .dot { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
               background: var(--sheet); border: 2px solid var(--line); color: var(--ink-2); }
  .rung .dot svg { width: 16px; height: 16px; }
  .rung .rname { font-weight: 700; padding-top: 4px; color: var(--ink-2); }
  .rung.used .dot { background: var(--hi); border-color: var(--ink); color: var(--ink); }
  .rung.used .rname { color: var(--ink); }
  .rung.next .dot { border-color: var(--ink); color: var(--ink); border-style: dashed; }
  .rung.next .rname { color: var(--ink); }
  .rung.answer.used .dot { background: var(--ink); color: #fff; }
  .note { grid-column: 2; margin-top: 8px; padding: 12px 14px; border-radius: 4px 14px 14px 14px; background: var(--hi-soft); border: 1px solid #F0D766; font-size: 16px; line-height: 1.5; }
  .note.ai { background: var(--pen-soft); border-color: #C3D2FA; border-radius: 4px 14px 14px 14px; }
  .note.ai .q { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.35; color: var(--ink); margin: 6px 0 2px; }
  .ai-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--pen-ink); }
  .ai-tag .chip { display: grid; grid-template-columns: repeat(3, 3px); gap: 1.5px; padding: 3px; border-radius: 4px; background: var(--led-bg); }
  .ai-tag .chip i { width: 3px; height: 3px; border-radius: 50%; background: var(--led-on); }
  .note + .note { margin-top: 8px; }
  .note b.lead { display: block; font-size: 13px; color: var(--hi-ink); margin-bottom: 2px; }
  .note .small { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
  .note .ex { display: block; width: 100%; margin: 10px 0; padding: 0; border: 1px solid #E8D27A; border-radius: 10px; background: #fff; overflow: hidden; cursor: zoom-in; }
  .note .ex img { display: block; width: 100%; height: auto; }
  .note .btn { min-height: 40px; padding: 6px 14px; font-size: 15px; box-shadow: 0 2px 0 var(--ink); }
  .note .letters-out { display: inline-flex; gap: 6px; margin: 0 2px; }
  .note .letters-out b { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: #fff; border: 1.5px solid var(--ink-2); position: relative; font-family: var(--display); }
  .note .letters-out b::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; background: var(--red); transform: rotate(-20deg); }
  .note.fresh { animation: pop .35s cubic-bezier(.2, .9, .3, 1.3); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }

  .chat { padding: 16px; }
  .chat h2 { font-size: 19px; margin-bottom: 8px; }
  .chat-log { display: grid; gap: 8px; max-height: 16rem; overflow: auto; }
  .chat-log:empty { display: none; }
  .chat-log p { margin: 0; padding: 8px 11px; border-radius: 10px; background: var(--pen-soft); overflow-wrap: anywhere; }
  .chat-log .mine { justify-self: end; background: var(--paper); }
  .chat-log small { display: block; color: var(--ink-2); margin-top: 4px; }
  .chat-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chat-form input { flex: 1 1 12rem; min-width: 0; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line);
                     border-radius: 10px; background: var(--paper); font: inherit; }
  .chat-status { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
  .chat-status:empty { display: none; }
  .practice-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 20px; }
  .tap-cap { display: none; margin: 8px 0 0; font-size: 14px; font-weight: 700; color: var(--pen-ink); text-align: center; }
  .levels { padding: 18px; }
  .levels h2 { font-size: 19px; margin-bottom: 12px; }
  .lvl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; font-size: 15px; }
  .lvl + .lvl { border-top: 1px dashed var(--line); }
  .lvl.cur b { color: var(--pen-ink); }
  .lvl b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lvl span { color: var(--ink-2); font-size: 14px; }
  .pips { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
  .pips i { height: 6px; border-radius: 3px; background: var(--grid); }
  .pips i.on { background: var(--pen); }

  /* ---------- teacher ---------- */
  .teacher { padding: 24px; }
  .teacher-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .teacher-head h1 { font-size: clamp(26px, 3.6vw, 38px); }
  .pick { min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-weight: 700; max-width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { padding: 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
  .stat b { display: block; font-family: var(--display); font-size: 30px; line-height: 1.1; }
  .stat span { font-size: 14px; color: var(--ink-2); }
  .advice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--hi-soft); border: 1px solid #F0D766; margin-bottom: 22px; }
  .advice svg { width: 22px; height: 22px; flex: none; margin-top: 2px; }
  .teacher h2 { font-size: 20px; margin: 4px 0 10px; }
  .table { overflow-x: auto; margin-bottom: 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; color: var(--ink-2); font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .pips { display: inline-grid; width: 96px; vertical-align: middle; margin-left: 8px; }
  .status { font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 13px; }

/* The board's LED matrix, drawn the same way as applab/math-matrix/python/main.py */
const PICTURES = {
  correct: ["............#", "...........##", "..........##.", ".#.......##..", ".##.....##...", "..##...##....", "...##.##.....", "....###......"],
  wrong: ["..##.....##..", "...##...##...", "....##.##....", ".....###.....", ".....###.....", "....##.##....", "...##...##...", "..##.....##.."],
  hint: ["....#####....", "...#.....#...", "...#..#..#...", "...#..#..#...", "....#.#.#....", ".....###.....", ".....###.....", "......#......"],
  thinking: [".............", ".............", ".............", "..##..##..##.", "..##..##..##.", ".............", ".............", "............."],
  idle: [".............", "..#.......#..", "..#.......#..", ".............", ".#.........#.", "..#.......#..", "...#######...", "............."]
};
const HOLD_MS = 4000;
const picture = name => PICTURES[name].map(line => [...line].map(c => c === "#" ? 2 : 0));
function levelBar(level) {
  const grid = Array.from({ length: 8 }, () => Array(13).fill(0));
  level = Math.max(0, Math.min(7, level | 0));
  for (let step = 0; step < 8; step++) {
    const col = Math.floor(1 + step * 1.5), height = step + 1;
    for (let row = 8 - height; row < 8; row++) grid[row][col] = step <= level ? 2 : 1;
  }
  return grid;
}
const led = { seq: null, shownAt: 0, level: 0, reachable: null, grid: picture("idle") };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang = store.get("tutor.lang") === "cat" ? "cat" : "eng";
let info = null, state = null, name = "", busy = false, feedback = { text: "", kind: "" };
let chosenTopic = "", chosenLevel = 1, view = "setup", lastHintCount = 0;
let conversation = { key: "", lastHint: "", pending: false };
const t = () => T[lang];

async function api(path, body) {
  const options = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.status);
  return data;
}

function setFeedback(text, kind) { feedback = { text, kind }; drawFeedback(); }
function drawFeedback() {
  const el = $("feedback");
  el.className = "feedback " + (feedback.text ? feedback.kind : "");
  el.innerHTML = feedback.text ? (feedback.kind === "ok" ? UI.tick : feedback.kind === "bad" ? UI.cross : UI.info) + `<span>${esc(feedback.text)}</span>` : "";
}

/* ---------- LED mirror ---------- */
function drawLed(id) {
  const box = $(id);
  if (!box.firstChild) box.innerHTML = `<div class="led-grid" aria-hidden="true">${"<i></i>".repeat(104)}</div>` +
    `<div class="led-cap"><span class="led-title"></span><span class="live"></span></div>`;
  const cells = box.querySelectorAll(".led-grid i");
  led.grid.forEach((row, r) => row.forEach((v, c) => { cells[r * 13 + c].className = v === 2 ? "on" : v === 1 ? "dim" : ""; }));
  box.querySelector(".led-title").textContent = t().ledTitle;
  const live = box.querySelector(".live");
  live.textContent = led.reachable ? t().ledLive : t().ledOff;
  live.classList.toggle("off", !led.reachable);
  box.setAttribute("role", "img");
  box.setAttribute("aria-label", t().ledTitle);
}
function drawLeds() { drawLed("ledSetup"); drawLed("ledPlay"); }
async function pollLed() {
  if (!document.hidden) {
    try {
      const data = await api("/api/matrix");
      led.reachable = true;
      const event = data.event || "idle";
      if (data.level !== undefined && data.level !== null) led.level = data.level;
      const seq = data.seq !== undefined ? data.seq : event + data.time;
      if (seq !== led.seq) { led.seq = seq; led.shownAt = performance.now(); }
      const fresh = performance.now() - led.shownAt < HOLD_MS;
      if (event === "thinking") led.grid = picture("thinking");
      else if (["correct", "wrong", "hint"].includes(event) && fresh) led.grid = picture(event);
      else if (event === "idle") led.grid = picture("idle");
      else led.grid = levelBar(led.level);
    } catch (error) { led.reachable = false; led.grid = picture("idle"); }
    drawLeds();
  }
  setTimeout(pollLed, 400);
}

/* ---------- setup ---------- */
function drawStatic() {
  document.documentElement.lang = lang === "cat" ? "ca" : "en";
  document.title = "Pista · " + t().tagline;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t()[el.dataset.t]; });
  document.querySelectorAll("#lang button").forEach(b => { b.classList.toggle("on", b.dataset.lang === lang); b.setAttribute("aria-pressed", b.dataset.lang === lang); });
  $("teacherLink").setAttribute("aria-label", t().teacher);
  $("chatInput").placeholder = t().chatPlaceholder;
  $("howList").innerHTML = t().rungs.map((r, i) =>
    `<li><span><b>${esc(r)}</b><br><span class="muted">${esc(t().rungHow[i])}</span></span></li>`).join("");
  drawTopics(); drawStairs(); drawLeds();
}
function drawTopics() {
  if (!info) { $("topics").innerHTML = ""; return; }
  const tiles = [{ key: "", name: t().mixed, sub: t().mixedSub }].concat(info.topics.map(x => ({ key: x.key, name: x.names[lang], sub: t().problems(x.count) })));
  $("topics").innerHTML = tiles.map(x => `<button class="topic" type="button" data-topic="${esc(x.key)}" aria-pressed="${x.key === chosenTopic}">` +
    `<span class="ic">${icon(x.key || "mixed")}</span><span><b>${esc(x.name)}</b><small>${esc(x.sub)}</small></span></button>`).join("");
}
function drawStairs() {
  const levels = info ? info.levels : [0, 1, 2, 3, 4, 5, 6, 7];
  $("stairs").innerHTML = levels.map(n => `<button class="stair ${n < chosenLevel ? "below" : ""}" type="button" data-level="${n}" aria-pressed="${n === chosenLevel}" ` +
    `aria-label="${esc(t().levelHelp(n))}" style="height:${30 + n * 11}%">${n}</button>`).join("");
  $("levelHelp").textContent = t().levelHelp(chosenLevel);
}

/* ---------- practice ---------- */
function drawMeta(p) {
  $("meta").innerHTML = `<span class="tag">${icon(p.topic)}${esc(p.topic_name)}</span><span class="tag plain">${esc(t().levelN(p.level))}</span>` +
    (p.text_only ? "" : `<span class="tag plain">${esc(t().picture)}</span>`) +
    (p.tries ? `<span class="tag plain">${esc(t().tries(p.tries))}</span>` : "") +
    `<span class="grow"></span>` + (state.student.streak ? `<span class="streak">${UI.flame}${esc(t().streak(state.student.streak))}</span>` : "");
}
function drawLetters(p) {
  $("letters").innerHTML = "ABCDE".split("").map(letter => {
    let cls = "", off = p.closed;
    if (p.label === letter) cls = "right";
    else if (p.tried.includes(letter)) { cls = "wrong"; off = true; }
    else if (p.eliminated.includes(letter)) { cls = "out"; off = true; }
    return `<button class="letter ${cls}" data-letter="${letter}" ${off ? "disabled" : ""}>${letter}<kbd>${letter}</kbd></button>`;
  }).join("");
}
function drawLadder(p) {
  const byKind = Object.fromEntries(p.hints.map(h => [h.kind, h]));
  const fresh = p.hints.length > lastHintCount ? p.hints.at(-1).kind : null;
  $("rungs").innerHTML = ["orient", "apply", "check"].map((kind, i) => {
    const hint = byKind[kind];
    const upcoming = info?.model && !p.closed && kind === p.next_hint;
    const cls = hint ? "used" : upcoming ? "next" : "";
    const body = hint ? `<div class="note ${fresh === kind && !reduceMotion ? "fresh" : ""}">${esc(hint.text)}</div>` : "";
    return `<li class="rung ${cls}"><span class="dot">${hint || upcoming ? i + 1 : UI.lock}</span><span class="rname">${esc(t().rungs[i])}</span>${body}</li>`;
  }).join("");
  lastHintCount = p.hints.length;
}
function drawLevels() {
  const current = state.problem ? state.problem.topic : null;
  const rows = state.profile.slice();
  if (state.problem && !rows.some(r => r.topic === current)) rows.push({ topic: current, topic_name: state.problem.topic_name, level: state.problem.level });
  $("levelList").innerHTML = rows.length ? rows.map(r => `<div class="lvl ${r.topic === current ? "cur" : ""}"><b>${esc(r.topic_name)}</b>` +
    `<span>${esc(t().levelN(r.level))}${r.topic === current ? " · " + esc(t().nowHere) : ""}</span>` +
    `<span class="pips">${[0, 1, 2, 3, 4, 5, 6, 7].map(n => `<i class="${n <= r.level ? "on" : ""}"></i>`).join("")}</span></div>`).join("")
    : `<p class="muted" style="margin:0;font-size:15px">${esc(t().noLevels)}</p>`;
}
function note(id, text) {
  $(id).textContent = text || "";
  $(id).classList.toggle("hidden", !text);
}

function drawProblem() {
  const p = state.problem;
  $("who").textContent = state.student.name;
  drawLevels();
  $("sheet").classList.toggle("hidden", !p);
  $("answerCard").classList.toggle("hidden", !p);
  $("doneAll").classList.toggle("hidden", !!p);
  drawChat(p);
  if (!p) { $("rungs").innerHTML = ""; return; }
  drawMeta(p);
  if ($("image").getAttribute("src") !== p.image) $("image").src = p.image;
  $("image").alt = p.topic_name + ", " + t().levelN(p.level);
  $("stamp").classList.toggle("show", p.status === "solved");
  drawLetters(p);
  drawLadder(p);
  note("modelFeedback", p.coaching);
  $("feedbackBtn").classList.toggle("hidden", !info?.model || p.closed || !p.tries || Boolean(p.coaching));
  $("feedbackBtn").disabled = conversation.pending;
  note("transferPrompt", p.transfer === "open" && t().transferOpen);
  note("transferResult", t().transferResult[p.transfer]);
  if (!feedback.text) {
    if (p.status === "solved") setFeedback(t().right(p.label), "ok");
    else if (p.status === "revealed") setFeedback(t().revealed(p.label), "info");
    else if (p.status === "failed") setFeedback(t().failed, "bad");
    else if (p.tries) setFeedback(t().wrong, "bad");
  }
  $("hintBtn").classList.toggle("hidden", !info?.model || p.closed || !p.next_hint);
  $("hintBtn").disabled = conversation.pending;
  $("hintBtn").innerHTML = UI.bulb + esc(p.hints.length ? t().hintMore : t().hint);
  $("solutionBtn").classList.toggle("hidden", p.status === "solved" || p.status === "revealed");
  $("solutionBtn").textContent = t().showAnswer;
  $("nextBtn").innerHTML = esc(p.transfer_available ? t().transferNext : p.closed ? t().next : t().skip) + UI.next;
  $("nextBtn").className = "btn push" + (p.closed ? " primary" : "");
  drawFeedback();
}

function show(next) {
  view = next;
  for (const id of ["setup", "play", "teacher"]) $(id).classList.toggle("hidden", id !== next);
  $("who").classList.toggle("hidden", next !== "play");
  $("teacherLink").classList.toggle("hidden", next === "teacher");
  window.scrollTo(0, 0);
}

async function step(path, body, after) {
  if (busy) return;
  busy = true;
  try {
    const problem = path !== "/api/start" ? state?.problem?.id : undefined;
    const data = await api(path, { ...body, problem });
    if (data.problem?.id !== state?.problem?.id) lastHintCount = data.problem?.hints.length || 0;
    state = { student: data.student, problem: data.problem, profile: data.profile };
    if (after) after(data);
    drawProblem();
    return data;
  } catch (error) {
    setFeedback(error instanceof TypeError ? t().error : String(error.message), "bad");
  } finally { busy = false; }
}

function start() {
  const candidate = $("name").value.trim();
  if (!candidate) { $("setupError").textContent = t().needName; $("name").focus(); return; }
  if (busy) return;
  name = candidate;
  $("setupError").textContent = "";
  store.set("tutor.name", name);
  feedback = { text: "", kind: "" };
  lastHintCount = 0;
  step("/api/start", { name, language: lang, topic: chosenTopic, level: chosenLevel }, () => show("play"));
}

function drawChat(p) {
  const key = p ? JSON.stringify([name, lang, p.id]) : "";
  if (conversation.key !== key) {
    conversation = { key, lastHint: "", pending: false };
    $("chatLog").replaceChildren();
    $("chatStatus").textContent = "";
    $("chatInput").value = "";
  }
  $("chatCard").classList.toggle("hidden", !p || !info?.model ||
    (p.closed && !conversation.pending && !$("chatStatus").textContent && !$("chatLog").childElementCount));
  $("chatForm").classList.toggle("hidden", !p || p.closed || !info?.model);
  $("chatSend").disabled = conversation.pending;
}

function appendChat(text, source) {
  const row = document.createElement("p");
  row.textContent = text;
  if (source) {
    const label = document.createElement("small");
    label.textContent = source;
    row.append(label);
  } else {
    row.className = "mine";
  }
  $("chatLog").append(row);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
}

function sendChat(event) {
  event.preventDefault();
  requestCoaching("chat", $("chatInput").value.trim());
}

async function requestCoaching(mode, message = "") {
  const p = state?.problem;
  const turn = conversation;
  const stillHere = () => turn === conversation && state?.problem?.closed === p.closed && state.problem.tries === p.tries;
  if (!p || turn.pending || busy || p.closed || (mode === "chat" && !message)) return;
  turn.pending = true;
  $("chatStatus").textContent = t().chatWaiting;
  drawProblem();
  if (mode === "chat") {
    $("chatInput").value = "";
    appendChat(message);
  }
  try {
    let result = await api("/api/" + mode, { name, problem: p.id, message, last_hint: turn.lastHint });
    const job = result.job;
    if (job) {
      const deadline = Date.now() + result.wait_ms;
      do {
        await new Promise(resolve => setTimeout(resolve, 500));
        if (!stillHere()) return;
        if (Date.now() >= deadline) throw new Error("timed out");
        result = await api("/api/chat?job=" + encodeURIComponent(job));
      } while (result.pending);
    }
    if (!stillHere()) return;
    if (result.model_error) {
      $("chatStatus").textContent = t().modelErrors[result.model_error] || t().chatError;
      return;
    }
    state = { student: result.student, problem: result.problem, profile: result.profile };
    if (mode === "chat") {
      turn.lastHint = result.text;
      appendChat(result.text, t().chatModel);
    }
    $("chatStatus").textContent = "";
  } catch (error) {
    if (stillHere()) $("chatStatus").textContent = t().chatError;
  } finally {
    if (turn === conversation) {
      turn.pending = false;
      if (!stillHere()) $("chatStatus").textContent = "";
      drawProblem();
    }
  }
}

async function answer(letter) {
  const p = state && state.problem;
  if (!p || p.closed || p.tried.includes(letter) || p.eliminated.includes(letter)) return;
  $("confirm").classList.add("hidden");
  const result = await step("/api/answer", { name, choice: letter }, data => {
    if (data.correct) {
      const line = data.outcome === "up" ? t().up(data.level_after) : data.outcome === "stay" ? t().stay(data.level_after) : t().downSolved(data.level_after);
      setFeedback(t().right(data.problem.label) + " " + line, "ok");
    } else {
      setFeedback(data.closed ? t().failed : t().wrong, "bad");
      requestAnimationFrame(() => { const b = document.querySelector(`.letter[data-letter="${letter}"]`); if (b && !reduceMotion) b.classList.add("shake"); });
    }
  });
  if (result && !result.correct && !result.closed && info?.model) requestCoaching("feedback");
}

function hint() {
  if (info?.model && state?.problem?.next_hint) requestCoaching("hint");
}

function solution() {
  const p = state?.problem;
  if (!p || p.status === "solved" || p.status === "revealed") return;
  $("confirm").classList.remove("hidden");
  $("revealNo").focus();
}

function reveal() {
  $("confirm").classList.add("hidden");
  step("/api/reveal", { name }, data => setFeedback(t().revealed(data.label), "info"));
}

function next() {
  if (!state || !state.problem) return;
  feedback = { text: "", kind: "" }; $("confirm").classList.add("hidden");
  step("/api/next", { name }, data => { if (data.finished) setFeedback(t().finished, "ok"); window.scrollTo(0, 0); });
}

/* ---------- picture viewer ---------- */
let lastFocus = null;
function openViewer(src) {
  lastFocus = document.activeElement;
  $("viewerImg").src = src;
  $("viewer").classList.remove("hidden");
  $("viewerClose").focus();
}
function closeViewer() {
  $("viewer").classList.add("hidden");
  if (lastFocus) lastFocus.focus();
}

/* ---------- teacher view ---------- */
async function teacher(pick) {
  show("teacher");
  $("teacherClose").textContent = state ? t().back : t().backSetup;
  try {
    const students = await api("/api/students");
    if (!students.length) { $("studentPick").innerHTML = ""; $("studentPick").classList.add("hidden"); $("summary").innerHTML = `<p class="muted">${esc(t().noStudents)}</p>`; return; }
    $("studentPick").classList.remove("hidden");
    const chosen = pick || $("studentPick").value || name || students[0].name;
    $("studentPick").innerHTML = students.map(s => `<option value="${esc(s.name)}">${esc(s.name)} (${s.solved}/${s.problems})</option>`).join("");
    $("studentPick").value = students.some(s => s.name === chosen) ? chosen : students[0].name;
    const s = await api("/api/summary?name=" + encodeURIComponent($("studentPick").value) + "&language=" + lang);
    const dash = v => v === null || v === undefined || v < 0 ? "–" : v;
    const pips = level => `<span class="pips">${[0, 1, 2, 3, 4, 5, 6, 7].map(n => `<i class="${n <= level ? "on" : ""}"></i>`).join("")}</span>`;
    const tt = s.totals;
    $("summary").innerHTML =
      `<div class="stats">` +
        `<div class="stat"><b>${tt.attempts}</b><span>${esc(t().stProblems)}</span></div>` +
        `<div class="stat"><b>${tt.correct}${tt.accuracy === null ? "" : ` <small style="font-size:16px">(${Math.round(100 * tt.accuracy)}%)</small>`}</b><span>${esc(t().stSolved)}</span></div>` +
        `<div class="stat"><b>${tt.hints}</b><span>${esc(t().stHints)}</span></div>` +
        `<div class="stat"><b>${tt.best_streak}</b><span>${esc(t().stStreak)}</span></div>` +
        (s.transfer.attempted ? `<div class="stat"><b>${s.transfer.independent}/${s.transfer.attempted}</b><span>${esc(t().transferStat)}</span></div>` : "") +
      `</div>` +
      `<div class="advice">${UI.bulb}<div><b>${esc(t().practise)}</b><br>${esc(s.practise_next)}</div></div>` +
      (s.recommendations.length ? `<div class="practice-actions">` + s.recommendations.map(r =>
        `<button class="btn" type="button" data-practice="${esc(r.topic)}">${esc(t().practiceAction[r.kind])} · ${esc(r.topic_name)}</button>`).join("") + `</div>` : "") +
      `<h2>${esc(t().byTopic)}</h2><div class="table"><table><tr><th>${esc(t().thTopic)}</th><th>${esc(t().thLevel)}</th><th class="num">${esc(t().thMastered)}</th>` +
      `<th class="num">${esc(t().thAttempts)}</th><th class="num">${esc(t().thAcc)}</th><th class="num">${esc(t().thHints)}</th></tr>` +
      s.profile.map(p => `<tr><td>${esc(p.topic_name)}</td><td>${p.level}${pips(p.level)}</td><td class="num">${dash(p.mastered)}</td>` +
        `<td class="num">${p.attempts}</td><td class="num">${p.correct} (${Math.round(100 * p.accuracy)}%)</td><td class="num">${p.hints}</td></tr>`).join("") +
      `</table></div><h2>${esc(t().recent)}</h2>` +
      `<div class="table"><table><tr><th>${esc(t().thProblem)}</th><th>${esc(t().thTopic)}</th><th class="num">${esc(t().levelN(""))}</th>` +
      `<th>${esc(t().thResult)}</th><th class="num">${esc(t().thTries)}</th><th class="num">${esc(t().thHints)}</th><th class="num">${esc(t().thTime)}</th></tr>` +
      s.recent.map(r => `<tr><td>${esc(r.id)}</td><td>${esc(r.topic_name)}</td><td class="num">${r.level}</td><td><span class="status ${esc(r.status)}">${esc(t().status[r.status] || r.status)}</span></td>` +
        `<td class="num">${r.wrong_tries}</td><td class="num">${r.hints}</td><td class="num">${r.seconds === null ? "–" : Math.round(r.seconds) + " s"}</td></tr>`).join("") +
      `</table></div>`;
  } catch (error) { $("summary").innerHTML = `<p class="error">${esc(t().error)}</p>`; }
}

/* ---------- events ---------- */
$("lang").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !b.dataset.lang || b.dataset.lang === lang || busy) return;
  lang = b.dataset.lang; store.set("tutor.lang", lang); drawStatic();
  if (view === "teacher") teacher();
  else if (view === "play" && state) { feedback = { text: "", kind: "" }; step("/api/start", { name, language: lang, resume: true }); }
});
$("topics").addEventListener("click", e => { const b = e.target.closest(".topic"); if (b) { chosenTopic = b.dataset.topic; drawTopics(); } });
$("stairs").addEventListener("click", e => { const b = e.target.closest(".stair"); if (b) { chosenLevel = Number(b.dataset.level); drawStairs(); } });
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
$("letters").addEventListener("click", e => { const b = e.target.closest(".letter"); if (b) answer(b.dataset.letter); });
$("letters").addEventListener("animationend", e => e.target.classList.remove("shake"));
$("hintBtn").addEventListener("click", hint);
$("feedbackBtn").addEventListener("click", () => requestCoaching("feedback"));
$("solutionBtn").addEventListener("click", solution);
$("chatForm").addEventListener("submit", sendChat);
$("nextBtn").addEventListener("click", next);
$("revealYes").addEventListener("click", reveal);
$("revealNo").addEventListener("click", () => $("confirm").classList.add("hidden"));
$("problemBtn").addEventListener("click", () => openViewer($("image").src));
$("zoomBtn").addEventListener("click", () => openViewer($("image").src));
$("viewerClose").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) closeViewer(); });
$("teacherLink").addEventListener("click", () => teacher());
$("studentPick").addEventListener("change", () => teacher($("studentPick").value));
$("summary").addEventListener("click", e => {
  const button = e.target.closest("[data-practice]");
  if (!button || busy) return;
  name = $("studentPick").value;
  chosenTopic = button.dataset.practice;
  feedback = { text: "", kind: "" };
  lastHintCount = 0;
  step("/api/start", { name, language: lang, topic: chosenTopic }, () => show("play"));
});
$("teacherClose").addEventListener("click", () => {
  if (state && state.student.language !== lang) {
    feedback = { text: "", kind: "" };
    step("/api/start", { name, language: lang, resume: true }, () => show("play"));
  } else show(state ? "play" : "setup");
});
$("home").addEventListener("click", () => show("setup"));
document.addEventListener("keydown", e => {
  if (!$("viewer").classList.contains("hidden")) { if (e.key === "Escape") closeViewer(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (view !== "play") return;
  const key = e.key.toUpperCase();
  if ("ABCDE".includes(key) && key.length === 1) answer(key);
  else if (key === "H") hint();
  else if (key === "N" && state && state.problem && state.problem.closed) next();
});

(async function init() {
  $("name").value = store.get("tutor.name") || "";
  // A link like /?name=Aina&lang=cat&topic=counting&level=2 starts straight away
  const q = new URLSearchParams(location.search);
  if (q.get("lang") === "cat" || q.get("lang") === "eng") lang = q.get("lang");
  if (q.get("level") !== null && /^[0-7]$/.test(q.get("level"))) chosenLevel = Number(q.get("level"));
  drawStatic();
  show("setup");
  pollLed();
  try { info = await api("/api/info"); } catch (error) { $("setupError").textContent = t().error; }
  if (info && q.get("topic") && info.topics.some(x => x.key === q.get("topic"))) chosenTopic = q.get("topic");
  drawStatic();
  if (q.get("name")) { $("name").value = q.get("name"); start(); }
})();
</script>
