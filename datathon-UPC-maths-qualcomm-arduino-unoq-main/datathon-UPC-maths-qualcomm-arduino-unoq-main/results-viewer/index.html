<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de resultats</title>
<style>
  :root { --ink: #1d2433; --muted: #5c667a; --line: #dfe3ea; --bg: #f5f7fa; --card: #fff;
          --ok: #1b7f3b; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6; --accent: #1f5fbf; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  body.drag { outline: 3px dashed var(--accent); outline-offset: -6px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  #drop { border: 2px dashed var(--line); border-radius: 8px; padding: 28px; text-align: center; color: var(--muted); cursor: pointer; }
  #drop:hover, #drop.over { border-color: var(--accent); color: var(--accent); }
  .link { color: var(--accent); text-decoration: underline; cursor: pointer; }
  #file { display: none; }
  #filelist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .res { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  .res:hover { border-color: var(--accent); color: var(--accent); }
  .res span { color: var(--muted); margin-left: 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 22px; font-weight: 700; }
  .card .s { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .g { margin: 6px 0; }
  .g .top { display: flex; justify-content: space-between; font-size: 13px; }
  .g .top b { font-weight: 600; }
  .gbar { height: 10px; border-radius: 5px; background: var(--bad-bg); overflow: hidden; margin-top: 3px; }
  .gbar div { height: 100%; background: var(--ok); }
  .hint { color: var(--muted); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .filters label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, input[type="text"] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  input[type="text"] { width: 180px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { cursor: pointer; user-select: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--line); }
  th:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  td.wrap { white-space: normal; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--bg); }
  .tick { color: var(--ok); font-weight: 700; }
  .cross { color: var(--bad); font-weight: 700; }
  .st { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .st.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
  tr.detail td { background: var(--bg); white-space: normal; }
  pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); padding: 10px; border-radius: 6px; font-size: 12px; max-height: 300px; overflow: auto; margin: 6px 0; }
  .kv { font-size: 12px; color: var(--muted); }
  .cm { text-align: center; min-width: 34px; }
  .cm-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  .cm-bad { background: var(--bad-bg); color: var(--bad); }
  .cm-sum { color: var(--muted); }
  td.wrap2 { white-space: normal; min-width: 220px; }
  .slots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .slot { font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--muted); }
  .slot.on { background: var(--card); color: var(--ink); border-color: var(--accent); font-weight: 600; }
  .slot .x { border: 0; background: none; cursor: pointer; font-size: 15px; padding: 0 3px; color: var(--muted); }
  .slot .x:hover { color: var(--bad); }
  .listrow { display: inline-flex; align-items: stretch; gap: 4px; }
  .mini { font: inherit; font-size: 12px; font-weight: 700; color: var(--accent); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .mini:hover { border-color: var(--accent); }
  #drop2 { border: 2px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; margin-top: 12px; }
  #drop2:hover, #drop2.over { border-color: var(--accent); color: var(--accent); }
  .gbar.a { height: 8px; } .gbar.a div { background: var(--accent); }
  .gbar.b { height: 8px; margin-top: 2px; }
  .card .v.up { color: var(--ok); } .card .v.down { color: var(--bad); }
  .pill.up { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .pill.down { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  #cmlegend { font-size: 13px; color: var(--muted); }
  .cmpout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .cmpout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Visor de resultats</h1>
  <span id="fname" class="pill">Cap fitxer carregat</span>
  <span id="fstamp" class="pill"></span>
</header>
<main>
  <section id="load">
    <div id="drop" title="Clica per triar un fitxer">
      Arrossega aquí un CSV de <code>results/</code> &mdash; o <span class="link">tria'l</span>
    </div>
    <input type="file" id="file" accept=".csv,text/csv">
    <div id="slots" class="slots"></div>
    <div id="filelist"></div>
    <div id="cmpload" hidden>
      <div id="drop2" title="Clica per triar el segon fitxer">
        Compara amb un segon CSV: arrossega'l aqu&iacute; &mdash; o <span class="link">tria'l</span>
      </div>
      <input type="file" id="file2" accept=".csv,text/csv">
    </div>
  </section>

  <div id="cmp" hidden>
    <div class="cards" id="cmcards"></div>
    <div id="cmlegend" class="hint"></div>
    <div class="grid2" id="cmgroups"></div>
    <section>
      <h2>Preguntes que canvien</h2>
      <table>
        <thead id="cmfhead"></thead>
        <tbody id="cmfbody"></tbody>
      </table>
      <p class="hint" id="cmfnote"></p>
    </section>
    <div class="grid2" id="cmstats"></div>
  </div>

  <div id="dash" hidden>
    <div class="cards" id="cards"></div>
    <div class="grid2" id="breakdown"></div>
    <div class="grid2" id="diag"></div>
    <section>
      <h2>Preguntes</h2>
      <div class="filters" id="filters"></div>
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="hint" id="tcount"></p>
    </section>
  </div>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const isTrue = v => /^(1|true|yes)$/i.test(String(v).trim());
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const fmt1 = v => v == null ? "&mdash;" : (Math.round(v * 10) / 10).toFixed(1);
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "&mdash;";

// --- CSV parser (handles quoted fields with commas, quotes and newlines) ---
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [], row = [];
  let field = "", inQ = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; }
        else { inQ = false; i++; }
      } else { field += c; i++; }
    } else if (c === '"') { inQ = true; i++; }
    else if (c === ",") { row.push(field); field = ""; i++; }
    else if (c === "\n") { row.push(field); rows.push(row.slice()); row.length = 0; i++; }
    else if (c === "\r") { i++; }
    else { field += c; i++; }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  while (rows.length && rows[rows.length - 1].every(f => f === "")) rows.pop();
  return rows;
}

let COLS = [], ROWS = [];
let DATA_A = null, DATA_B = null;   // A = run of reference, B = run to compare against
let cmpOpen = new Set();
let expanded = new Set();
let sort = { key: null, dir: 1 };
const F = { lang: "", level: "", status: "", onlyWrong: false, q: "" };

const isEval = () => COLS.includes("problem_id") && COLS.includes("is_correct");
const okRow = r => (r.status || "ok") === "ok" && String(r.selected_answer).trim() !== "";
const correctRow = r => isTrue(r.is_correct);
const shortName = s => String(s).replace(/^eval-/, "").replace(/\.csv$/i, "");
const joinKey = r => (r.problem_id ?? "") + "\u0000" + (r.language ?? "");

function toData(name, text) {
  const rows = parseCSV(text);
  if (!rows.length) { alert("El fitxer sembla buit."); return null; }
  let cols = rows[0].map(h => h.trim());
  const out = rows.slice(1).map(r => {
    const o = {}; cols.forEach((h, i) => o[h] = r[i] == null ? "" : r[i]); return o;
  });
  // adapt older/simpler schemas to the current eval column names
  const ALIASES = [["problem_id", "id"], ["selected_answer", "answer"], ["correct_answer", "label"],
                   ["elapsed_seconds", "seconds"], ["input_tokens", "prompt_tokens"], ["is_correct", "correct"]];
  for (const [to, from] of ALIASES) {
    if (cols.includes(to) || !cols.includes(from)) continue;
    cols = cols.concat(to);
    out.forEach(r => r[to] = r[from]);
  }
  return { name, cols, rows: out };
}

function loadInto(slot, name, text) {
  const d = toData(name, text);
  if (!d) return;
  if (slot === "B") {
    if (!DATA_A) { alert("Primer carrega el CSV A, que fa de referència."); return; }
    if (!DATA_A.cols.includes("is_correct") || !d.cols.includes("is_correct")) {
      alert("Per comparar, tots dos fitxers han de tenir resposta correcta."); return;
    }
    DATA_B = d;
  } else {
    DATA_A = d;
    DATA_B = null;
  }
  renderAll();
}

function clearSlot(slot) {
  if (slot === "A") { DATA_A = null; DATA_B = null; } else DATA_B = null;
  renderAll();
}

// --- summary cards ---
function cards() {
  const n = ROWS.length, c = ROWS.filter(correctRow).length;
  const valid = ROWS.filter(okRow), cv = valid.filter(correctRow).length;
  const cards = [
    { k: "Encerts", v: pct(c, n), s: c + " de " + n },
    { k: "Precisió (respostes vàlides)", v: pct(cv, valid.length), s: cv + " de " + valid.length + " vàlides" },
    { k: "Tokens mitjans", v: (num(meanOfCol("input_tokens")) ?? 0).toFixed(0) + " / " + (num(meanOfCol("output_tokens")) ?? 0).toFixed(0), s: "entrada / sortida" },
    { k: "Temps mitjà (real)", v: fmt1(meanOfCol("elapsed_seconds")) + " s", s: "per pregunta" },
  ];
  if (COLS.includes("arduino_estimated_seconds"))
    cards.push({ k: "Temps estimat Arduino", v: fmt1(meanOfCol("arduino_estimated_seconds")) + " s", s: "mitjà per pregunta" });
  $("#cards").innerHTML = cards.map(x =>
    '<div class="card"><div class="k">' + x.k + '</div><div class="v">' + x.v + '</div><div class="s">' + x.s + '</div></div>').join("");
}
function meanOfCol(k) { return mean(ROWS.map(r => num(r[k])).filter(v => v != null)); }

// --- breakdown bars (accuracy by group) ---
function accuracyBy(keyFn, labelFn) {
  const g = new Map();
  for (const r of ROWS) {
    const k = keyFn(r);
    if (!g.has(k)) g.set(k, { n: 0, c: 0 });
    const e = g.get(k); e.n++; if (correctRow(r)) e.c++;
  }
  return [...g.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0]), "ca", { numeric: true }))
    .map(([k, e]) => ({ key: k, label: labelFn(k), ...e, p: e.n ? e.c / e.n : 0 }));
}

function barList(title, groups) {
  const body = groups.map(g =>
    '<div class="g"><div class="top"><b>' + esc(g.label) + '</b><span>' + g.c + "/" + g.n + " &middot; " + Math.round(100 * g.p) + '%</span></div>' +
    '<div class="gbar"><div style="width:' + (g.p * 100).toFixed(1) + '%"></div></div></div>').join("");
  return '<section><h2>' + title + '</h2>' + (body || '<p class="hint">Sense dades.</p>') + '</section>';
}

function breakdown() {
  const nopt = v => isTrue(v) ? "amb opcions" : "sense opcions";
  $("#breakdown").innerHTML =
    barList("Precisió per nivell", accuracyBy(r => String(r.level ?? ""), k => "nivell " + k)) +
    barList("Precisió per llengua", accuracyBy(r => r.language || "—", k => k)) +
    barList("Amb opcions OCR", accuracyBy(r => nopt(r.has_options), k => k)) +
    barList("Per estat de resposta", accuracyBy(r => r.status || "—", k => k));
}

// --- diagnostics ---
function panel(title, html) {
  return '<section><h2>' + title + '</h2>' + html + '</section>';
}
function gRow(label, right, frac) {
  return '<div class="g"><div class="top"><b>' + label + '</b><span>' + right + '</span></div>' +
    (frac == null ? '' : '<div class="gbar"><div style="width:' + (frac * 100).toFixed(1) + '%"></div></div>') + '</div>';
}
const maxOf = key => ROWS.reduce((m, r) => Math.max(m, num(r[key]) ?? 0), 0);

function truncPanel() {
  if (!COLS.includes("output_tokens")) return "";
  const maxOut = maxOf("output_tokens");
  if (!maxOut) return "";
  const atCap = r => num(r.output_tokens) != null && num(r.output_tokens) >= maxOut;
  const at = ROWS.filter(atCap), rest = ROWS.filter(r => !atCap(r));
  const okAt = at.filter(correctRow).length, okRest = rest.filter(correctRow).length;
  const outOk = mean(ROWS.filter(correctRow).map(r => num(r.output_tokens)).filter(v => v != null));
  const outBad = mean(ROWS.filter(r => !correctRow(r)).map(r => num(r.output_tokens)).filter(v => v != null));
  let html = gRow("Sortida més llarga vista", maxOut + " tokens", null);
  html += gRow("Respostes que toquen el límit", at.length + " de " + ROWS.length, null);
  html += gRow("Precisió si es talla", pct(okAt, at.length) + " (" + okAt + "/" + at.length + ")", at.length ? okAt / at.length : null);
  html += gRow("Precisió si acaba dins el límit", pct(okRest, rest.length) + " (" + okRest + "/" + rest.length + ")", rest.length ? okRest / rest.length : null);
  if (outOk != null) html += gRow("Tokens sortida — encertades", fmt1(outOk) + " de mitjana", null);
  if (outBad != null) html += gRow("Tokens sortida — fallades", fmt1(outBad) + " de mitjana", null);
  return panel("Sortida del model: tokens i tall", html);
}

function confusionPanel() {
  const pairs = new Map();               // correct letter -> Map(selected letter -> n)
  const letters = new Set();
  let noAns = 0;
  for (const r of ROWS) {
    const c = String(r.correct_answer || "").trim().toUpperCase();
    const s = String(r.selected_answer || "").trim().toUpperCase();
    if (!/^[A-Z]$/.test(c)) continue;
    letters.add(c);
    if (/^[A-Z]$/.test(s)) {
      letters.add(s);
      if (!pairs.has(c)) pairs.set(c, new Map());
      const m = pairs.get(c);
      m.set(s, (m.get(s) || 0) + 1);
    } else noAns++;
  }
  const L = [...letters].sort();
  if (!L.length) return "";
  const head = "<tr><th>correcta &darr; tria &rarr;</th>" + L.map(l => "<th>" + l + "</th>").join("") + "<th>total</th></tr>";
  const body = L.map(c => {
    const m = pairs.get(c) || new Map();
    const total = [...m.values()].reduce((a, b) => a + b, 0);
    return "<tr><td><b>" + c + "</b></td>" + L.map(s => {
      const n = m.get(s) || 0;
      const cls = n ? (s === c ? "cm-ok" : "cm-bad") : "";
      return '<td class="cm ' + cls + '">' + (n || "&middot;") + "</td>";
    }).join("") + '<td class="cm-sum">' + total + "</td></tr>";
  }).join("");
  return panel("Resposta triada vs correcta",
    "<table>" + head + body + "</table>" +
    (noAns ? '<p class="hint">A més, ' + noAns + ' pregunta' + (noAns > 1 ? "s" : "") + ' sense lletra reconeixible.</p>' : ""));
}

function slowestPanel() {
  if (!COLS.includes("elapsed_seconds")) return "";
  const rs = ROWS.filter(r => num(r.elapsed_seconds) != null)
    .sort((a, b) => num(b.elapsed_seconds) - num(a.elapsed_seconds)).slice(0, 5);
  if (!rs.length) return "";
  const rows = rs.map(r => "<tr><td>" + esc(r.problem_id) + "</td><td>" + fmt1(num(r.elapsed_seconds)) + " s</td><td>" +
    fmt1(num(r.arduino_estimated_seconds)) + " s</td></tr>").join("");
  return panel("Les 5 preguntes més lentes",
    "<table><tr><th class='wrap2'>problema</th><th>temps</th><th>est. Arduino</th></tr>" + rows + "</table>");
}

function ragPanel() {
  if (!COLS.includes("retrieved")) return "";
  if (!ROWS.some(r => String(r.retrieved || "").trim() !== "")) return "";
  return barList("Amb / sense exemples RAG",
    accuracyBy(r => String(r.retrieved || "").trim() !== "" ? "amb RAG" : "sense RAG", k => k));
}

function buildDiag() {
  $("#diag").innerHTML = truncPanel() + confusionPanel() + slowestPanel() + ragPanel();
}

// --- filters ---
function buildFilters() {
  const uniq = key => [...new Set(ROWS.map(r => String(r[key] ?? "")).filter(Boolean))].sort();
  const opt = (v, cur) => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(v) + "</option>";
  $("#filters").innerHTML =
    '<label>Llengua <select id="f-lang"><option value="">totes</option>' + uniq("language").map(v => opt(v, F.lang)).join("") + "</select></label>" +
    '<label>Nivell <select id="f-level"><option value="">tots</option>' + uniq("level").map(v => opt(v, F.level)).join("") + "</select></label>" +
    '<label>Estat <select id="f-status"><option value="">tots</option>' + uniq("status").map(v => opt(v, F.status)).join("") + "</select></label>" +
    '<label><input type="checkbox" id="f-wrong"' + (F.onlyWrong ? " checked" : "") + '> només no encertades</label>' +
    '<input type="text" id="f-q" placeholder="Cerca…" value="' + esc(F.q) + '">';
  $("#f-lang").onchange = e => { F.lang = e.target.value; renderTable(); };
  $("#f-level").onchange = e => { F.level = e.target.value; renderTable(); };
  $("#f-status").onchange = e => { F.status = e.target.value; renderTable(); };
  $("#f-wrong").onchange = e => { F.onlyWrong = e.target.checked; renderTable(); };
  $("#f-q").oninput = e => { F.q = e.target.value; renderTable(); };
}

function filtered() {
  let rs = ROWS.filter(r => {
    if (F.lang && String(r.language ?? "") !== F.lang) return false;
    if (F.level && String(r.level ?? "") !== F.level) return false;
    if (F.status && String(r.status ?? "") !== F.status) return false;
    if (F.onlyWrong && correctRow(r)) return false;
    if (F.q) {
      const hay = (r.problem_id + " " + r.model_output).toLowerCase();
      if (!hay.includes(F.q.toLowerCase())) return false;
    }
    return true;
  });
  if (sort.key) {
    const k = sort.key;
    const vals = rs.map(r => {
      const v = r[k];
      const n = num(v);
      return { r, v: n != null ? n : String(v).toLowerCase() };
    });
    vals.sort((a, b) => {
      const t = typeof a.v === "number" && typeof b.v === "number" ? a.v - b.v : String(a.v).localeCompare(String(b.v), "ca");
      return t * sort.dir;
    });
    rs = vals.map(x => x.r);
  }
  return rs;
}

// --- table ---
const EVAL_COLS = [
  { key: "problem_id", label: "problema" },
  { key: "level", label: "niv." },
  { key: "language", label: "lleng." },
  { key: "selected_answer", label: "tria" },
  { key: "correct_answer", label: "correcta" },
  { key: "is_correct", label: "✔" },
  { key: "status", label: "estat" },
  { key: "input_tokens", label: "tok in" },
  { key: "output_tokens", label: "tok out" },
  { key: "elapsed_seconds", label: "temps (s)" },
  { key: "arduino_estimated_seconds", label: "est. Arduino (s)" },
];

function renderTable() {
  $("#thead").innerHTML = "<tr>" + EVAL_COLS.map(c =>
    '<th data-key="' + c.key + '" class="' + (sort.key === c.key ? "sorted" : "") + '">' + c.label +
    (sort.key === c.key ? (sort.dir > 0 ? " ▲" : " ▼") : "") + "</th>").join("") + "</tr>";
  [...$("#thead").querySelectorAll("th")].forEach(th =>
    th.onclick = () => {
      const k = th.dataset.key;
      sort = { key: k, dir: sort.key === k ? -sort.dir : 1 };
      renderTable();
    });

  const rs = filtered();
  const out = [];
  rs.forEach((r, i) => {
    const good = correctRow(r);
    out.push('<tr class="row" data-i="' + i + '">' +
      '<td class="wrap">' + esc(r.problem_id) + "</td>" +
      "<td>" + esc(r.level) + "</td>" +
      "<td>" + esc(r.language) + "</td>" +
      "<td>" + esc(r.selected_answer) + "</td>" +
      "<td>" + esc(r.correct_answer) + "</td>" +
      '<td class="' + (good ? "tick" : "cross") + '">' + (good ? "✔" : "✘") + "</td>" +
      '<td><span class="st' + (okRow(r) ? "" : " bad") + '">' + esc(r.status || "—") + "</span></td>" +
      "<td>" + (num(r.input_tokens) ?? "&mdash;") + "</td>" +
      "<td>" + (num(r.output_tokens) ?? "&mdash;") + "</td>" +
      "<td>" + fmt1(num(r.elapsed_seconds)) + "</td>" +
      "<td>" + fmt1(num(r.arduino_estimated_seconds)) + "</td></tr>");
    if (expanded.has(i)) {
      const kv = [];
      if (r.retrieved) kv.push("RAG: " + esc(r.retrieved));
      if (r.evaluated_at) kv.push(esc(r.evaluated_at));
      if (COLS.includes("arduino_read_estimated_seconds"))
        kv.push("est. Arduino: " + fmt1(num(r.arduino_read_estimated_seconds)) + "s lectura + "
          + fmt1(num(r.arduino_write_estimated_seconds)) + "s escriptura");
      out.push('<tr class="detail"><td colspan="' + EVAL_COLS.length + '">' +
        (kv.length ? '<div class="kv">' + kv.join(" &middot; ") + "</div>" : "") +
        "<pre>" + esc(r.model_output || "(buit)") + "</pre></td></tr>");
    }
  });
  $("#tbody").innerHTML = out.join("") || '<tr><td colspan="' + EVAL_COLS.length + '" class="hint">Cap fila amb aquests filtres.</td></tr>';
  $("#tcount").textContent = "Mostrant " + rs.length + " de " + ROWS.length + " preguntes — clica una fila per veure la sortida del model.";
  [...$("#tbody").querySelectorAll("tr.row")].forEach(tr =>
    tr.onclick = () => {
      const i = +tr.dataset.i;
      expanded.has(i) ? expanded.delete(i) : expanded.add(i);
      renderTable();
    });
}

// --- generic CSV (e.g. ablations.csv) ---
function renderGeneric() {
  $("#filters").innerHTML = "";
  $("#diag").innerHTML = "";
  const cols = COLS.slice(0, 12);
  const numeric = cols.filter(c => ROWS.some(r => num(r[c]) != null));
  const stats = numeric.map(c =>
    '<span class="pill">' + esc(c) + " mitjana: " + fmt1(meanOfCol(c)) + "</span>").join(" ");
  const head = "<tr>" + cols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr>";
  const body = ROWS.slice(0, 500).map(r =>
    "<tr>" + cols.map(c => '<td class="wrap">' + esc(String(r[c]).slice(0, 200) || "&mdash;") + "</td>").join("") + "</tr>").join("");
  $("#cards").innerHTML = '<div class="card"><div class="k">Files</div><div class="v">' + ROWS.length + '</div><div class="s">CSV genèric (no és un resultat d\'avaluació)</div></div>';
  $("#breakdown").innerHTML = stats ? '<section><h2>Mitjanes de columnes numèriques</h2>' + stats + "</section>" : "";
  $("#thead").innerHTML = head;
  $("#tbody").innerHTML = body;
  $("#tcount").textContent = ROWS.length > 500 ? "Mostrant les primeres 500 files." : "";
  $("#thead").querySelectorAll("th").forEach(th => th.onclick = null);
  $("#thead").querySelectorAll("th").forEach(th => th.style.cursor = "default");
}

function render() {
  if (!DATA_A) {
    $("#fname").textContent = "Cap fitxer carregat";
    $("#fstamp").textContent = "";
    $("#cmpload").hidden = true;
    $("#dash").hidden = true;
    $("#cmp").hidden = true;
    return;
  }
  $("#cmpload").hidden = false;
  ROWS = DATA_A.rows;
  COLS = DATA_A.cols;
  expanded = new Set();
  cmpOpen = new Set();
  sort = { key: null, dir: 1 };
  Object.keys(F).forEach(k => F[k] = k === "onlyWrong" ? false : "");
  $("#fname").textContent = shortName(DATA_A.name) + (DATA_B ? "  vs  " + shortName(DATA_B.name) : "") + " (" + ROWS.length + " files)";
  const stamps = ROWS.map(r => r.evaluated_at).filter(Boolean);
  $("#fstamp").textContent = stamps.length ? stamps[0].replace("T", " ").slice(0, 16) : "";
  if (DATA_B) {
    $("#dash").hidden = true;
    $("#cmp").hidden = false;
    renderCompare();
  } else {
    $("#cmp").hidden = true;
    $("#dash").hidden = false;
    if (isEval()) {
      cards(); breakdown(); buildDiag(); buildFilters(); renderTable();
    } else {
      renderGeneric();
    }
  }
}

function renderAll() {
  renderSlots();
  render();
}

// --- loading: drag & drop, file picker, server list ---
function readFile(f) {
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadCSV(f.name, String(rd.result));
  rd.readAsText(f);
}
$("#drop").onclick = () => $("#file").click();
$("#file").onchange = e => readFile(e.target.files[0]);
for (const ev of ["dragover", "dragenter"]) {
  document.body.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("drag"); });
}
for (const ev of ["dragleave", "drop"]) {
  document.body.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove("drag"); });
}
document.body.addEventListener("drop", e => readFile(e.dataTransfer.files[0]));

// If served by server.py, show the CSVs available in results/
(async () => {
  try {
    const res = await fetch("api/results");
    if (!res.ok) return;
    const files = (await res.json()).files;
    if (!files.length) return;
    $("#filelist").innerHTML = files.map(f =>
      '<button class="res" data-name="' + esc(f.name) + '">' + esc(f.name) + "<span>" + (f.kb).toFixed(0) + " kB</span></button>").join("");
    [...$("#filelist").querySelectorAll(".res")].forEach(b =>
      b.onclick = async () => {
        const r = await fetch("results/" + encodeURIComponent(b.dataset.name));
        loadCSV(b.dataset.name, await r.text());
      });
  } catch (e) { /* opened as file:// — drag & drop still works */ }
})();
</script>
